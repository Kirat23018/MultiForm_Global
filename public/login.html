  <script src="assets/js/api.js"></script>
  <script>
    async function handleOwnerLogin(event) {
      event.preventDefault();
      const email = document.getElementById('login-email').value.trim();
      const password = document.getElementById('login-password').value;
      const btn = document.getElementById('btn-login-submit');
      const originalText = btn.innerHTML;

      try {
        btn.disabled = true;
        btn.innerHTML = 'Verifying credentials...';

        const res = await mfgApi.login(email, password);
        if (res.success) {
          window.location.href = 'portfolio.html';
        } else {
          alert('Invalid credentials. Please verify your email and password.');
        }
      } catch (err) {
        alert('Login failed: ' + (err.message || 'Please check connection'));
      } finally {
        btn.disabled = false;
        btn.innerHTML = originalText;
      }
    }
  </script>
